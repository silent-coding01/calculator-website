  <title>Nova Calculator</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #080d18;
      --panel: #111a2b;
      --screen: #0b1322;
      --button: #1b2940;
      --button-hover: #293b57;
      --text: #f4f7ff;
      --muted: #91a0b8;
      --accent: #7c5cff;
      --accent-hover: #9279ff;
      --operator: #183d53;
      --danger: #532637;
    }

    body {
      min-height: 100vh;
      padding: 24px 14px;
      display: flex;
      justify-content: center;

      background:
        radial-gradient(ellipse at top, #18254a 0%, transparent 55%),

    .brand h1 {

    .calculator {

<body>
  <main class="app">
    <header class="header">
      <div class="brand">
        <div class="brand-icon" aria-hidden="true">÷</div>
        <div>
          <h1>Nova Calculator</h1>
          <p>Simple. Smart. Fast.</p>
        </div>
      </div>
      <div class="status">● Online</div>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="screen" aria-live="polite">
        <div class="previous" id="previous"></div>
        <div class="display" id="display">0</div>
      </div>

      <div class="keys">
        <button class="clear" data-action="clear" aria-label="Clear all">AC</button>
        <button class="utility" data-action="delete" aria-label="Delete last digit">DEL</button>
        <button class="utility" data-action="percent" aria-label="Percent">%</button>
        <button class="operator" data-operator="/" aria-label="Divide">÷</button>

        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button class="operator" data-operator="*" aria-label="Multiply">×</button>

        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button class="operator" data-operator="-" aria-label="Subtract">−</button>

        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button class="operator" data-operator="+" aria-label="Add">+</button>

        <button class="zero" data-number="0">0</button>
        <button data-action="decimal" aria-label="Decimal point">.</button>
        <button class="equals" data-action="equals" aria-label="Calculate result">=</button>
      </div>

      <section class="history" aria-label="Calculation history">
        <div class="history-header">
          <h2>Recent calculations</h2>
          <button id="clearHistory">Clear history</button>
        </div>
        <div class="history-list" id="historyList">
          <p class="empty-history">Your calculations will appear here.</p>
        </div>
      </section>
    </section>

    <footer class="footer">
      Made for everyday calculations.<br>
      <span>Keep learning. Keep building.</span>
    </footer>
  </main>

  <script>
    const display = document.getElementById("display");
    const previous = document.getElementById("previous");
    const historyList = document.getElementById("historyList");

    let current = "0";
    let stored = null;
    let operator = null;
    let waitingForNumber = false;
    let justCalculated = false;
    let history = [];

    function render() {
      display.textContent = current;
      previous.textContent =
        stored !== null && operator
          ? `${formatNumber(stored)} ${symbol(operator)}`
          : "";
    }

    function formatNumber(number) {
      if (!Number.isFinite(number)) return "Error";
      return String(Number(number.toPrecision(12)));
    }

    function symbol(op) {
      return ({ "+": "+", "-": "−", "*": "×", "/": "÷" })[op] || op;
    }

    function inputNumber(number) {
      if (current === "Error" || waitingForNumber || justCalculated) {
        current = number;
        waitingForNumber = false;
        justCalculated = false;
      } else if (current.length < 16) {
        current = current === "0" ? number : current + number;
      }
      render();
    }

    function inputDecimal() {
      if (current === "Error" || waitingForNumber || justCalculated) {
        current = "0.";
        waitingForNumber = false;
        justCalculated = false;
      } else if (!current.includes(".") && current.length < 16) {
        current += ".";
      }
      render();
    }

    function calculate(a, op, b) {
      switch (op) {
        case "+": return a + b;
        case "-": return a - b;
        case "*": return a * b;
        case "/": return b === 0 ? NaN : a / b;
        default: return b;
      }
    }

    function chooseOperator(nextOperator) {
      if (current === "Error") return;

      const value = Number(current);

      if (operator && !waitingForNumber) {
        const result = calculate(stored, operator, value);

        if (!Number.isFinite(result)) {
          current = "Error";
          stored = null;
          operator = null;
          waitingForNumber = true;
          render();
          return;
        }

        current = formatNumber(result);
        stored = Number(current);
      } else {
        stored = value;
      }

      operator = nextOperator;
      waitingForNumber = true;
      justCalculated = false;
      render();
    }

    function addHistory(expression, result) {
      history.unshift({ expression, result });
      history = history.slice(0, 5);
      renderHistory();
    }

    function renderHistory() {
      historyList.replaceChildren();

      if (history.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty-history";
        empty.textContent = "Your calculations will appear here.";
        historyList.appendChild(empty);
        return;
      }

      history.forEach(item => {
        const button = document.createElement("button");
        button.className = "history-item";
        button.type = "button";

        const expression = document.createElement("span");
        expression.textContent = item.expression;

        const result = document.createElement("strong");
        result.textContent = item.result;

        button.append(expression, result);
        button.addEventListener("click", () => {
          current = item.result;
          stored = null;
          operator = null;
          waitingForNumber = false;
          justCalculated = true;
          render();
        });

        historyList.appendChild(button);
      });
    }

    function equals() {
      if (operator === null || stored === null || waitingForNumber ||
          current === "Error") return;

      const a = stored;
      const b = Number(current);
      const op = operator;
      const result = calculate(a, op, b);

      if (!Number.isFinite(result)) {
        current = "Error";
      } else {
        current = formatNumber(result);
        addHistory(
          `${formatNumber(a)} ${symbol(op)} ${formatNumber(b)} =`,
          current
        );
      }

      stored = null;
      operator = null;
      waitingForNumber = true;
      justCalculated = true;
      render();
    }

    function percent() {
      if (current === "Error") return;

      const value = Number(current);

      // In an expression such as 200 + 10%, use 10% of 200.
      if (stored !== null && operator && !waitingForNumber &&
          (operator === "+" || operator === "-")) {
        current = formatNumber(stored * value / 100);
      } else {
        current = formatNumber(value / 100);
      }

      waitingForNumber = false;
      justCalculated = false;
      render();
    }

    function clearAll() {
      current = "0";
      stored = null;
      operator = null;
      waitingForNumber = false;
      justCalculated = false;
      render();
    }

    function deleteLast() {
      if (current === "Error" || waitingForNumber || justCalculated) {
        current = "0";
        waitingForNumber = false;
        justCalculated = false;
      } else if (current.length > 1) {
        current = current.slice(0, -1);
        if (current === "-") current = "0";
      } else {
        current = "0";
      }
      render();
    }

    document.querySelector(".keys").addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.number !== undefined) {
        inputNumber(button.dataset.number);
      } else if (button.dataset.operator) {
        chooseOperator(button.dataset.operator);
      } else {
        switch (button.dataset.action) {
          case "clear": clearAll(); break;
          case "delete": deleteLast(); break;
          case "decimal": inputDecimal(); break;
          case "percent": percent(); break;
          case "equals": equals(); break;
        }
      }
    });

    document.getElementById("clearHistory").addEventListener("click", () => {
      history = [];
      renderHistory();
    });

    document.addEventListener("keydown", event => {
      if (/^[0-9]$/.test(event.key)) {
        inputNumber(event.key);
      } else if (event.key === ".") {
        inputDecimal();
      } else if (["+", "-", "*", "/"].includes(event.key)) {
        chooseOperator(event.key);
      } else if (event.key === "Enter" || event.key === "=") {
        event.preventDefault();
        equals();
      } else if (event.key === "Backspace") {
        deleteLast();
      } else if (event.key === "Escape" || event.key === "Delete") {
        clearAll();
      } else if (event.key === "%") {
        percent();
      }
    });

    render();
  </script>
</body>
</html>
