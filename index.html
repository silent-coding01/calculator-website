<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website - Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: black;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px 15px;
        }

        h1 {
            font-size: 36px;
            margin-top: 25px;
        }

        .intro {
            font-size: 18px;
            margin-bottom: 30px;
        }

        .calculator {
            width: 100%;
            max-width: 350px;
            margin: auto;
            padding: 18px;
            background: #1b1b1b;
            border: 1px solid #444;
            border-radius: 15px;
            box-shadow: 0 0 20px #222;
        }

        #display {
            width: 100%;
            height: 70px;
            margin-bottom: 15px;
            padding: 10px;
            background: #080808;
            color: white;
            border: 1px solid #555;
            border-radius: 8px;
            font-size: 28px;
            text-align: right;
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        button {
            height: 58px;
            border: none;
            border-radius: 8px;
            background: #363636;
            color: white;
            font-size: 21px;
            cursor: pointer;
        }

        button:hover {
            filter: brightness(1.3);
        }

        .operator {
            background: #1749d1;
        }

        .special {
            background: #555;
        }

        .equal {
            background: #0b9c60;
        }

        .zero {
            grid-column: span 2;
        }

        .footer {
            margin-top: 25px;
            color: #999;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website!</h1>
    <p class="intro">I am learning web development.</p>

    <div class="calculator">

        <input type="text" id="display"
               value="0" readonly
               aria-label="Calculator display">

        <div class="buttons">
            <button class="special" onclick="clearDisplay()">AC</button>
            <button class="special" onclick="deleteLast()">DEL</button>
            <button class="operator" onclick="chooseOperator('%')">%</button>
            <button class="operator" onclick="chooseOperator('/')">÷</button>

            <button onclick="inputNumber('7')">7</button>
            <button onclick="inputNumber('8')">8</button>
            <button onclick="inputNumber('9')">9</button>
            <button class="operator" onclick="chooseOperator('*')">×</button>

            <button onclick="inputNumber('4')">4</button>
            <button onclick="inputNumber('5')">5</button>
            <button onclick="inputNumber('6')">6</button>
            <button class="operator" onclick="chooseOperator('-')">−</button>

            <button onclick="inputNumber('1')">1</button>
            <button onclick="inputNumber('2')">2</button>
            <button onclick="inputNumber('3')">3</button>
            <button class="operator" onclick="chooseOperator('+')">+</button>

            <button class="zero" onclick="inputNumber('0')">0</button>
            <button onclick="inputDecimal()">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>

    </div>

    <p class="footer">Built using HTML, CSS and JavaScript</p>

    <script>
        const display = document.getElementById("display");

        let current = "0";
        let previous = null;
        let operator = null;
        let startNew = false;

        function updateDisplay() {
            display.value = current;
        }

        function inputNumber(number) {
            if (current === "Error" || startNew) {
                current = number;
                startNew = false;
            } else if (current === "0") {
                current = number;
            } else if (current.length < 15) {
                current += number;
            }

            updateDisplay();
        }

        function inputDecimal() {
            if (current === "Error" || startNew) {
                current = "0.";
                startNew = false;
            } else if (!current.includes(".")) {
                current += ".";
            }

            updateDisplay();
        }

        function chooseOperator(op) {
            if (current === "Error") return;

            if (operator !== null && !startNew) {
                calculate();
            }

            previous = Number(current);
            operator = op;
            startNew = true;
        }

        function calculate() {
            if (operator === null || previous === null) return;

            const a = previous;
            const b = Number(current);
            let result;

            switch (operator) {
                case "+":
                    result = a + b;
                    break;

                case "-":
                    result = a - b;
                    break;

                case "*":
                    result = a * b;
                    break;

                case "/":
                    if (b === 0) {
                        current = "Error";
                        previous = null;
                        operator = null;
                        startNew = true;
                        updateDisplay();
                        return;
                    }
                    result = a / b;
                    break;

                case "%":
                    result = a % b;
                    break;
            }

            if (!Number.isFinite(result)) {
                current = "Error";
            } else {
                current = String(
                    Number(result.toPrecision(12))
                );
            }

            previous = null;
            operator = null;
            startNew = true;
            updateDisplay();
        }

        function clearDisplay() {
            current = "0";
            previous = null;
            operator = null;
            startNew = false;
            updateDisplay();
        }

        function deleteLast() {
            if (current === "Error" || startNew) {
                current = "0";
                startNew = false;
            } else {
                current = current.slice(0, -1);

                if (current === "" || current === "-") {
                    current = "0";
                }
            }

            updateDisplay();
        }

        document.addEventListener("keydown", function(event) {
            if (/^[0-9]$/.test(event.key)) {
                inputNumber(event.key);
            } else if (event.key === ".") {
                inputDecimal();
            } else if (["+", "-", "*", "/", "%"].includes(event.key)) {
                chooseOperator(event.key);
            } else if (event.key === "Enter" || event.key === "=") {
                calculate();
            } else if (event.key === "Backspace") {
                deleteLast();
            } else if (event.key === "Escape") {
                clearDisplay();
            }
        });
    </script>

</body>
</html>
